name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: planetary-explorer/container-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            planetary-explorer/container-app/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r ../../requirements.txt

      - name: Run backend tests
        run: python -m pytest tests -q -p no:cacheprovider

  helpers-and-docs:
    name: Deployment helpers, documentation, and templates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: planetary-explorer/web-ui/.nvmrc

      - name: Install dependencies
        run: python -m pip install -r requirements.txt httpx shapely

      - name: Run helper tests
        run: python -m pytest scripts/tests -q -p no:cacheprovider

      - name: Run browser verifier unit tests
        run: node --test scripts/tests/*.test.mjs

      - name: Run PowerShell deployment tests
        shell: pwsh
        run: Invoke-Pester -Path planetary-explorer/scripts/tests -CI

      - name: Check documentation links
        run: python scripts/verify_documentation.py

      - name: Compile Bicep templates
        run: |
          az bicep build --file planetary-explorer/infra/main.bicep --stdout > /dev/null
          az bicep build --file planetary-explorer/infra/chat-history-upgrade.bicep --stdout > /dev/null

  web-ui:
    name: Web UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: planetary-explorer/web-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: planetary-explorer/web-ui/.nvmrc
          cache: npm
          cache-dependency-path: planetary-explorer/web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:run

      - name: Run static host and build configuration tests
        run: npm run test:deployment

      - name: Build production bundle
        run: npm run build
