[project]
name = "planetary-explorer-web-search-mcp"
version = "0.1.0"
description = "Azure Web Search MCP service for Planetary Explorer"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "azure-identity>=1.19.0",
    "mcp>=1.27.0,<2.0.0",
    "openai>=1.66.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "uvicorn>=0.31.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_search_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]