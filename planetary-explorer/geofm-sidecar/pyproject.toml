[project]
name = "planetary-explorer-geofm"
version = "0.1.0"
description = "Durable GeoFM execution service for Planetary Explorer"
requires-python = ">=3.10,<3.12"
dependencies = [
    "azure-identity>=1.15.0",
    "azure-storage-blob>=12.20.0",
    "azure-storage-queue>=12.12.0",
    "mcp>=1.27.0,<2.0.0",
    "numpy==1.26.4",
    "planetary-computer>=1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pyproj>=3.6.0",
    "pystac-client>=0.7.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "uvicorn>=0.31.1",
]

[project.optional-dependencies]
worker = [
    "einops==0.8.1",
    "huggingface-hub==1.0.1",
    "timm==0.4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geofm_service"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]