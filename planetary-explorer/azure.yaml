# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/schemas/v1.0/azure.yaml.json

name: planetary-explorer
metadata:
  template: planetary-explorer@2.0.0

infra:
  provider: bicep

workflows:
  up:
    steps:
      - azd: provision
      - azd: deploy web
      - azd: deploy api
      # GeoFM is opt-in because deployGeoFm defaults to false. After enabling
      # it, run: azd deploy geofm; azd deploy geofm-worker.

services:
  web:
    project: ./web-ui
    dist: dist
    host: appservice
    language: js
    
  api:
    project: ./container-app
    host: containerapp
    language: python

  geofm:
    project: ./geofm-sidecar
    host: containerapp
    language: docker
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

  geofm-worker:
    project: ./geofm-sidecar
    host: containerapp
    language: docker
    docker:
      path: ./Dockerfile.worker
      context: .
      remoteBuild: true
