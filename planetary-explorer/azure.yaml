# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/schemas/v1.0/azure.yaml.json

name: planetary-explorer
metadata:
  template: planetary-explorer@2.0.0

infra:
  provider: bicep

hooks:
  preprovision:
    kind: python
    run: ../scripts/resolve_deployment_targets.py --write-azd-env
  postup:
    - kind: python
      run: ../scripts/deploy_optional_azd_services.py
    - kind: python
      run: ../scripts/configure_auth_postdeploy.py

workflows:
  up:
    steps:
      - azd: provision
      - azd: package web
      - azd: package api
      - azd: deploy web
      - azd: deploy api
      # GeoFM is opt-in because deployGeoFm defaults to false. After enabling
      # it, run: azd deploy geofm; azd deploy geofm-worker.

services:
  web:
    project: ./web-ui
    dist: dist
    host: appservice
    language: js
    resourceName: ${AZURE_WEB_APP_NAME}
    env:
      VITE_API_BASE_URL: ${AZURE_CONTAINER_APP_URL}
      VITE_AZURE_MAPS_SUBSCRIPTION_KEY: ${AZURE_MAPS_SUBSCRIPTION_KEY}
    
  api:
    project: ./container-app
    host: containerapp
    language: python
    resourceName: ${AZURE_CONTAINER_APP_NAME}
    hooks:
      postdeploy:
        kind: python
        run: ../../scripts/configure_api_postdeploy.py

  web-search-mcp:
    project: ./web-search-mcp
    host: containerapp
    language: docker
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
    hooks:
      postdeploy:
        kind: python
        run: ../../scripts/configure_api_postdeploy.py --profile web-search

  geofm:
    project: ./geofm-sidecar
    host: containerapp
    language: docker
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
    hooks:
      postdeploy:
        kind: python
        run: ../../scripts/configure_api_postdeploy.py --profile geofm

  geofm-worker:
    project: ./geofm-sidecar
    host: containerapp
    language: docker
    docker:
      path: ./Dockerfile.worker
      context: .
      remoteBuild: true
