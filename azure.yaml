# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/schemas/v1.0/azure.yaml.json
#
# Root-level azd manifest so a forker can clone this repo and run
# ``azd up`` from the repo root without having to ``cd planetary-explorer``
# first. All paths below resolve relative to this file. The canonical
# manifest still lives at planetary-explorer/azure.yaml for in-tree work;
# both keep service definitions in sync.
#
# Quick deploy for a forked OSS clone:
#   azd auth login
#   azd init           # picks this manifest, prompts for env name
#   azd up             # provisions infra + builds + deploys
#
# Default toggles (off by default, billed-resource-friendly):
#   - enableFabric           = false   (no Fabric capacity created)
#   - deployFabricCapacity   = false   (would be F2 ~ $262/mo)
#   - enableMpcPro           = false   (UI shows locked "How to enable" link)
#   - deployMpcMcp           = false   (no MPC Pro MCP sidecar)
#   - enablePrivateEndpoints = false   (public endpoints + Entra auth in-app)
#
# Flip any of these via:  azd env set <PARAM_NAME> true
# Then re-run:           azd provision

name: planetary-explorer
metadata:
  template: planetary-explorer@2.0.0

infra:
  provider: bicep
  path: planetary-explorer/infra
  module: main

hooks:
  preprovision:
    kind: python
    run: ./scripts/resolve_deployment_targets.py --write-azd-env
  postup:
    - kind: python
      run: ./scripts/deploy_optional_azd_services.py
    - kind: python
      run: ./scripts/configure_auth_postdeploy.py

workflows:
  up:
    steps:
      - azd: provision
      - azd: package web
      - azd: package api
      - azd: deploy web
      - azd: deploy api
      # GeoFM is opt-in because deployGeoFm defaults to false and provisions
      # billed GPU/private-link resources. After enabling it, publish both
      # optional services explicitly: azd deploy geofm; azd deploy geofm-worker.

services:
  web:
    project: ./planetary-explorer/web-ui
    dist: dist
    host: appservice
    language: js
    resourceName: ${AZURE_WEB_APP_NAME}
    env:
      VITE_API_BASE_URL: ${AZURE_CONTAINER_APP_URL}
      VITE_AZURE_MAPS_SUBSCRIPTION_KEY: ${AZURE_MAPS_SUBSCRIPTION_KEY}

  api:
    project: ./planetary-explorer/container-app
    host: containerapp
    language: python
    resourceName: ${AZURE_CONTAINER_APP_NAME}
    hooks:
      postdeploy:
        kind: python
        run: ../../scripts/configure_api_postdeploy.py

  geofm:
    project: ./planetary-explorer/geofm-sidecar
    host: containerapp
    language: docker
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
    hooks:
      postdeploy:
        kind: python
        run: ../../scripts/configure_api_postdeploy.py --profile geofm

  geofm-worker:
    project: ./planetary-explorer/geofm-sidecar
    host: containerapp
    language: docker
    docker:
      path: ./Dockerfile.worker
      context: .
      remoteBuild: true
